name: Build & Release

on:
  # Temporarily disabled — re-enable when ready:
  # push:
  #   branches: [main]
  #   tags: ['v*']
  workflow_dispatch:
  repository_dispatch:
    types: [sdk-release]

# Release assets are not Actions artifacts / Packages storage.
# Docs:
#   https://docs.github.com/en/repositories/releasing-projects-on-github/about-releases
#     (2 GiB per file; no total size or bandwidth cap)
#   https://docs.github.com/en/billing/concepts/product-billing/github-actions
#     (Actions artifacts share billed storage with GitHub Packages)
permissions:
  contents: write

# Serialize publishes that target the same rolling release (this-repo `dev`,
# or a given SDK tag) so overlapping runs cannot delete each other's assets.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sdk_version || 'dev' }}
  cancel-in-progress: false

jobs:
  # Create/reuse the destination GitHub Release first so matrix jobs can
  # attach installers directly with `gh release upload` (no artifact store).
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      dest: ${{ steps.meta.outputs.dest }}
      tag: ${{ steps.meta.outputs.tag }}
      repo: ${{ steps.meta.outputs.repo }}
    steps:
      - name: Set destination
        id: meta
        env:
          SDK_TOKEN: ${{ secrets.SDK_REPO_PAT }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "repository_dispatch" ] || { [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; }; then
            echo "dest=sdk" >> "$GITHUB_OUTPUT"
            echo "repo=wlkata/WLKATA-Python-SDK-wlkatapython" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
              TAG="${{ github.event.client_payload.sdk_version }}"
              if [ -z "$TAG" ]; then
                echo "repository_dispatch missing client_payload.sdk_version"
                exit 1
              fi
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            else
              if [ -z "${SDK_TOKEN:-}" ]; then
                echo "Missing secret SDK_REPO_PAT"
                exit 1
              fi
              TAG=$(GH_TOKEN="$SDK_TOKEN" gh release view \
                --repo wlkata/WLKATA-Python-SDK-wlkatapython \
                --json tagName -q .tagName)
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "dest=this" >> "$GITHUB_OUTPUT"
            echo "repo=${{ github.repository }}" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.meta.outputs.dest == 'this'

      - name: Recreate this-repo dev release
        if: steps.meta.outputs.dest == 'this'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete dev --yes || true
          git tag -f dev
          git push -f origin dev
          gh release create dev \
            --title "Dev Build (${GITHUB_SHA::7})" \
            --notes "Automated build from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}." \
            --prerelease

      - name: Confirm SDK release exists
        if: steps.meta.outputs.dest == 'sdk'
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_PAT }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_REPO: ${{ steps.meta.outputs.repo }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO"

  build-blockly:
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            python_url: https://github.com/astral-sh/python-build-standalone/releases/download/20260310/cpython-3.12.13+20260310-aarch64-apple-darwin-install_only.tar.gz
            pip: resources/python/bin/pip3
            build_cmd: npm run build:mac -- --arm64
            artifact_name: blockly-mac-arm64

          - os: macos-latest-large
            arch: x64
            python_url: https://github.com/astral-sh/python-build-standalone/releases/download/20260310/cpython-3.12.13+20260310-x86_64-apple-darwin-install_only.tar.gz
            pip: resources/python/bin/pip3
            build_cmd: npm run build:mac -- --x64
            artifact_name: blockly-mac-x64

          - os: windows-latest
            arch: x64
            python_url: https://github.com/astral-sh/python-build-standalone/releases/download/20260310/cpython-3.12.13+20260310-x86_64-pc-windows-msvc-install_only.tar.gz
            pip: resources/python/python.exe -m pip
            build_cmd: npm run build:win -- --x64
            artifact_name: blockly-win-x64

          - os: ubuntu-latest
            arch: x64
            python_url: https://github.com/astral-sh/python-build-standalone/releases/download/20260310/cpython-3.12.13+20260310-x86_64-unknown-linux-gnu-install_only.tar.gz
            pip: resources/python/bin/pip3
            build_cmd: npm run build:linux -- --x64
            artifact_name: blockly-linux-x64

#          - os: ubuntu-latest
#            arch: arm64
#            python_url: https://github.com/astral-sh/python-build-standalone/releases/download/20260310/cpython-3.12.13+20260310-aarch64-unknown-linux-gnu-install_only.tar.gz
#            pip: resources/python/bin/pip3
#            build_cmd: npm run build:linux -- --arm64
#            artifact_name: blockly-linux-arm64

    steps:
    - uses: actions/checkout@v6

    # Only the 3D viewer submodule is required in the artifact.
    # Do not use submodules: recursive — that would also clone extensions/*.
    # Repo is private: GITHUB_TOKEN cannot clone other private repos.
    # Secret WLKATA_SUBMODULE_TOKEN = PAT (contents:read) on
    #   wlkata/wlkata_arm_virtual-reality
    - name: Checkout viewer submodule
      shell: bash
      env:
        TOKEN: ${{ secrets.WLKATA_SUBMODULE_TOKEN }}
      run: |
        if [ -z "$TOKEN" ]; then
          echo "Missing secret WLKATA_SUBMODULE_TOKEN"
          echo "Create a PAT with read access to wlkata/wlkata_arm_virtual-reality"
          echo "and add it as a repository (or org) Actions secret."
          exit 1
        fi
        SHA=$(git rev-parse HEAD:resources/wlkata_arm_virtual-reality)
        echo "Pinned viewer SHA: $SHA"
        rm -rf resources/wlkata_arm_virtual-reality
        git clone --no-checkout \
          "https://x-access-token:${TOKEN}@github.com/wlkata/wlkata_arm_virtual-reality.git" \
          resources/wlkata_arm_virtual-reality
        git -C resources/wlkata_arm_virtual-reality checkout --force "$SHA"
        test -f resources/wlkata_arm_virtual-reality/RobotViewer.js
        test -d resources/wlkata_arm_virtual-reality/urdf
        ls resources/wlkata_arm_virtual-reality/urdf

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Download standalone Python
      shell: bash
      run: |
        mkdir -p resources
        curl -L "${{ matrix.python_url }}" -o python.tar.gz
        tar -xzf python.tar.gz -C resources
        rm python.tar.gz
        echo "Python extracted to resources/python"
        ls resources/python

    - name: Install wlkatapython SDK into embedded Python
      shell: bash
      run: |
        ${{ matrix.pip }} install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ wlkatapython-dev[ble]==1.0.0.dev3

    - name: Install Python dependencies into embedded Python
      shell: bash
      run: |
        ${{ matrix.pip }} install -r requirements.txt

    - name: Install Node.js dependencies
      run: npm ci || npm install

    # Own the signing keychain ourselves. electron-builder 26.x on macOS 26
    # often passes CSC_KEY_PASSWORD (the .p12 password) to
    # `security set-key-partition-list -k`, which needs the *keychain*
    # password instead — intermittent SecKeychainUnlock failures.
    - name: Import Mac signing certificate
      if: startsWith(matrix.os, 'macos')
      shell: bash
      env:
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      run: |
        set -euo pipefail

        if [ -z "${CSC_LINK:-}" ]; then
          echo "CSC_LINK not set — Mac build will be unsigned"
          exit 0
        fi

        KEYCHAIN="${RUNNER_TEMP}/studiox-signing.keychain-db"
        KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
        CERT_PATH="${RUNNER_TEMP}/certificate.p12"

        echo "$CSC_LINK" | base64 --decode > "$CERT_PATH"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        # Disable auto-lock so the keychain cannot lock mid-build.
        security set-keychain-settings "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

        security import "$CERT_PATH" \
          -k "$KEYCHAIN" \
          -P "$CSC_KEY_PASSWORD" \
          -T /usr/bin/codesign \
          -T /usr/bin/security \
          -T /usr/bin/productbuild

        # -k must be the keychain password, not the .p12 password.
        security set-key-partition-list \
          -S apple-tool:,apple: \
          -s \
          -k "$KEYCHAIN_PASSWORD" \
          "$KEYCHAIN" > /dev/null

        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        security default-keychain -s "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

        security find-identity -v -p codesigning "$KEYCHAIN"

        rm -f "$CERT_PATH"

        echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
        echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

    - name: Build Electron app
      shell: bash
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        set -euo pipefail

        if [[ "${{ matrix.os }}" == macos-* ]] && [ -n "${KEYCHAIN_PATH:-}" ]; then
          # Sign from our keychain only. Do not set CSC_LINK — otherwise
          # electron-builder creates its own temp keychain and hits the bug.
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          export CSC_KEYCHAIN="$KEYCHAIN_PATH"
          unset CSC_LINK CSC_KEY_PASSWORD || true
          ${{ matrix.build_cmd }} \
            -c.mac.entitlements=build/entitlements.mac.plist \
            -c.mac.entitlementsInherit=build/entitlements.mac.plist \
            -c.mac.notarize=true
        else
          ${{ matrix.build_cmd }}
        fi

    - name: Cleanup Mac signing keychain
      if: always() && startsWith(matrix.os, 'macos')
      shell: bash
      run: |
        if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
          security delete-keychain "$KEYCHAIN_PATH" || true
        fi

    - name: Upload installers to GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ needs.prepare-release.outputs.dest == 'sdk' && secrets.SDK_REPO_PAT || secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        RELEASE_REPO: ${{ needs.prepare-release.outputs.repo }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=(dist/*.dmg dist/*.exe dist/*.zip dist/*.AppImage dist/*.deb)
        if [ ${#files[@]} -eq 0 ]; then
          echo "No installer files in dist/"
          ls -la dist/ || true
          exit 1
        fi
        echo "Uploading to ${RELEASE_REPO}@${RELEASE_TAG}:"
        printf '  %s\n' "${files[@]}"
        gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$RELEASE_REPO" --clobber
